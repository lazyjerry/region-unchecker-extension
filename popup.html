<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 340px; margin: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    fieldset { border: 1px solid #ccc; margin: 0 0 8px; padding: 6px 8px; }
    label { display: block; }
    textarea { width: 100%; box-sizing: border-box; height: 48px; font: inherit; }
    .row { display: flex; gap: 6px; margin: 8px 0; }
    button { flex: 1; padding: 6px; font: inherit; cursor: pointer; }
    #run { background: #b3261e; color: #fff; border: 0; }
    #out { white-space: pre-wrap; background: #f5f5f5; padding: 6px; max-height: 260px; overflow: auto; font-size: 12px; }
    #out:empty { display: none; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1 data-i18n="extName"></h1>
  <fieldset id="groups"><legend data-i18n="groupsLegend"></legend></fieldset>
  <label><span data-i18n="extraLabel"></span>
    <textarea id="extra" data-i18n-placeholder="extraPlaceholder"></textarea>
  </label>
  <label><input type="checkbox" id="useSearch" checked> <span data-i18n="useSearch"></span></label>
  <div class="row">
    <button id="preview" data-i18n="previewButton"></button>
    <button id="run" data-i18n="runButton"></button>
  </div>
  <small data-i18n="saveHint"></small>
  <div id="out"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
